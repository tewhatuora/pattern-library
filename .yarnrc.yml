# Third-party install scripts are a common supply-chain attack vector. None are
# needed: esbuild and unrs-resolver ship prebuilt binaries as optional
# dependencies. Workspace scripts (e.g. the husky postinstall) still run.
enableScripts: false

nodeLinker: node-modules

# Don't install package versions published in the last 14 days
npmMinimalAgeGate: 14d
