name: Publish lib

on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      full-release:
        required: true
        type: string # 'true' or 'false'
      main-repo:
        required: true
        type: string
      theme-package:
        default: 'te-whatu-ora/anatomic-themes'
        type: string
  # push:
  #   tags:
  #     - 'v[0-9]+.[0-9]+.[0-9]+'
  #   branches:
  #     - '*actions*' # A temp trigger to test workflows - remove in prod

jobs:
  # build:
  #   uses: ./.github/workflows/build.yml

  publish:
    runs-on: ubuntu-latest
    #needs: build
    if: github.repository == inputs.main-repo
    steps:
    - name: determine components to publish
      id: components
      run: |
        echo "is-full-lib=${${{ inputs.full-release }}}" >> GITHUB_OUTPUT
        is-pre-lib=$(echo ${{ github.ref }} | grep -Pq '^refs/tags/v\d+\.\d+\.\d+-[\w\.-]+$' && echo 'true' || echo 'false')
        is-full-theme=$(echo ${{ github.ref }} | grep -Pq '^refs/tags/@${{ inputs.theme-package }}@\d+\.\d+\.\d+$' && echo 'true' || echo 'false')
        echo "is-full-theme=${is-full-theme}" >> $GITHUB_OUTPUT
        is-pre-theme=$(echo ${{ github.ref }} | grep -Pq '^refs/tags/@${{ inputs.theme-package }}@\d+\.\d+\.\d+-[\w\.-]+$' && echo 'true' || echo 'false')
        echo "is-pre-theme=${is-pre-theme}" >> $GITHUB_OUTPUT

    - name: log component values
      run: |
        echo is-full-lib '${{ steps.components.outputs.is-full-lib }}'
        echo is-pre-lib '${{ steps.components.outputs.is-pre-lib }}'
        echo is-full-theme '${{ steps.components.outputs.is-full-theme }}'
        echo is-pre-theme '${{ steps.components.outputs.is-pre-theme }}'

    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: setup node
      id: node-setup
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
  
    - name: restore cache
      uses: actions/cache/restore@v4
      id: restore-install-cache
      with:
        path: node_modules
        key: ${{ inputs.cache-key }}
    
    - name: download build artifact
      uses: actions/download-artifact@v4

    - name: publish library
      if: false
      run: |
        npm config set '//registry.npmjs.org/:_authToken' ${{ env.NPM_TOKEN }}
        yarn publish --cwd ./packages/lib --tag latest

    - name: publish prerelease library
      if: false
      run: |
        PRE_RELEASE_VERSION=${${{ github.ref_name }}#*.[0-9]*-}
        TAG_NAME=${PRE_RELEASE_VERSION%.*}
        echo $TAG_NAME
        npm config set '//registry.npmjs.org/:_authToken' ${{ env.NPM_TOKEN }}
        yarn publish --cwd ./packages/lib --tag $TAG_NAME

    - name: publish theme
      if: false
      run: |
        npm config set '//registry.npmjs.org/:_authToken' ${{ env.NPM_TOKEN }}
        yarn publish --cwd ./packages/theme --tag latest

    - name: publish prerelease theme
      if: false
      run: |
        PRE_RELEASE_VERSION=${${{ github.ref_name }}#*.[0-9]*-}
        TAG_NAME=${PRE_RELEASE_VERSION%.*}
        echo $TAG_NAME
        npm config set '//registry.npmjs.org/:_authToken' ${{ env.NPM_TOKEN }}
        yarn publish --cwd ./packages/theme --tag $TAG_NAME
