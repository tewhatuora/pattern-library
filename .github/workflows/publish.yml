name: Publish lib

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
    inputs:
      cache-key:
        required: true
        type: string
      is-full-lib:
        type: string # 'true' or 'false'
      is-pre-lib:
        type: string # 'true' or 'false'
      is-full-theme:
        type: string # 'true' or 'false'
      is-pre-theme:
        type: string # 'true' or 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        id: node-setup
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: enable corepack
        run: corepack enable

      - name: restore cache
        uses: actions/cache/restore@v4
        id: restore-install-cache
        with:
          path: '**/node_modules'
          key: ${{ inputs.cache-key }}

      # The build job saves this cache, but it can be evicted before this job runs
      - name: yarn install
        if: steps.restore-install-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      # - name: download build artifact
      #   uses: actions/download-artifact@v4

      # TODO get downloaded artifacts from previous jobs working to avoid additional build step
      - name: yarn build themes
        working-directory: ./packages/themes
        run: yarn build

      - name: yarn build
        run: yarn build

      - name: publish library
        if: inputs.is-full-lib == 'true'
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: yarn workspace @healthnz/pattern-library npm publish --access public --tag latest

      - name: publish prerelease library
        if: inputs.is-pre-lib == 'true'
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          GIT_REF="${{ github.ref_name }}"
          PRE_RELEASE_VERSION=${GIT_REF#*.[0-9]*-}
          TAG_NAME=${PRE_RELEASE_VERSION%.*}
          echo $TAG_NAME
          yarn workspace @healthnz/pattern-library npm publish --access public --tag $TAG_NAME

      - name: publish theme
        if: inputs.is-full-theme == 'true'
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: yarn workspace @healthnz/pattern-library-themes npm publish --access public --tag latest

      - name: publish prerelease theme
        if: inputs.is-pre-theme == 'true'
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          GIT_REF="${{ github.ref_name }}"
          PRE_RELEASE_VERSION=${GIT_REF#*.[0-9]*-}
          TAG_NAME=${PRE_RELEASE_VERSION%.*}
          echo $TAG_NAME
          yarn workspace @healthnz/pattern-library-themes npm publish --access public --tag $TAG_NAME
