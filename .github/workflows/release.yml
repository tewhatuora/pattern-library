name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+[A-Za-z0-9.-+]+'
    branches:
      - '*actions*' # A temp trigger to test workflows - remove in prod

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == needs.build.outputs.main-repo
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: setup node
      id: node-setup
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
  
    - name: restore cache
      uses: actions/cache/restore@v4
      id: restore-install-cache
      with:
        path: node_modules
        key: ${{ needs.build.outputs.cache-key }}
    
    - name: download build artifact
      uses: actions/download-artifact@v4

    - name: create release
      if: false
      uses: actions/create-release@v1
      with:
        tag_name: ''
        release_name: ''