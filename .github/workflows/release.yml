name: 'Create release'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+[A-Za-z0-9.\-\+]+'
    branches:
      - '*actions*' # A temp trigger to test workflows - remove in prod

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == needs.build.outputs.main-repo
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: setup node
      id: node-setup
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
  
    - name: restore cache
      uses: actions/cache/restore@v4
      id: restore-install-cache
      with:
        path: node_modules
        key: ${{ needs.build.outputs.cache-key }}
    
    - name: download build artifact
      uses: actions/download-artifact@v4

    - name: check if prerelease
      id: prerelease
      run: echo ${{ github.ref }} | egrep -q '^v[0-9]+\.[0-9]+\.[0-9]+$' && echo 'result=false' || echo 'result=true' >> GITHUB_OUTPUT

    - name: test prerelease output
      run: echo prerelease is ${{ steps.prerelease.outputs.result }}

    - name: create release
      # if: false # temp guardrail to prevent creating unwanted releases
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: ${{ github.ref }}
        body_path: 'CURRENT_VERSION.md'
        draft: true
        prerelease: ${{ steps.prerelease.outputs.result == 'true' }}