name: Build

on:
  workflow_call:
    outputs:
      cache-key:
        description: "Unique key for caching node_modules from yarn.lock files"
        value: ${{ jobs.build.outputs.cache-key }}
      main-repo:
        description: "Name of the main pattern-library repo"
        value: tewhatuora/pattern-library

jobs:

  build:
    name: Build packages
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.gen-key.outputs.key }}
    steps:

    - name: checkout
      uses: actions/checkout@v4

    - name: setup node
      id: node-setup
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: generate cache key
      id: gen-key
      run: |
        os="${{ runner.os }}"
        node="${{ steps.node-setup.outputs.node-version }}"
        hash="${{ hashFiles('**/yarn.lock') }}"
        echo "key=${os}-node-${node}-${hash}" >> $GITHUB_OUTPUT
  
    - name: restore cache
      uses: actions/cache/restore@v4
      id: restore-prev-cache
      with:
        path: node_modules
        key: ${{ steps.gen-key.outputs.key }}

    - name: yarn install
      if: steps.restore-prev-cache.outputs.cache-hit != 'true'
      run: yarn install --frozen-lockfile

    - name: save install cache
      if: steps.restore-prev-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      id: save-cache
      with:
        path: node_modules
        key: ${{ steps.gen-key.outputs.key }}
    
    - name: yarn build
      run: yarn build

    - name: yarn build storybook
      run: yarn build-storybook

    - name: Upload build artifacts
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: pattern-lib-build
        path: "**/dist/"
        if-no-files-found: error