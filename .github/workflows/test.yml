name: Test

on:
  push:
    branches:
      - main
      - '*actions*' # A temp trigger to test workflows

jobs:
  build:
    uses: ./.github/workflows/build.yml

  test:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.on-main-repo == true }}
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: setup node
      id: node-setup
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    
    - name: download build artifact
      uses: actions/download-artifact@v4

    - name: run tests
      run: echo testing...
