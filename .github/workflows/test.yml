name: Test

on:
  push:
    branches:
      - main
      - '*actions*' # A temp trigger to test workflows

jobs:
  build:
    uses: ./.github/workflows/build.yml

  test:
    runs-on: ubuntu-latest
    needs: build
    #if: github.repository == needs.build.outputs.main-repo
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: setup node
      id: node-setup
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
  
    - name: restore cache
      uses: actions/cache/restore@v4
      id: restore-install-cache
      with:
        path: node_modules
        key: ${{ needs.build.outputs.cache-key }}
    
    - name: download build artifact
      uses: actions/download-artifact@v4

    - name: run tests
      run: yarn chromatic --project-token chpt_83775190bd163fd
